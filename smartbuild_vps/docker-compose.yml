services:
  redis:
    image: redis:alpine
    container_name: build_redis
    ports:
      - "6379:6379"
    restart: always

  db:
    image: postgres:15-alpine
    container_name: build_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smartbuild_db
    ports:
      - "5432:5432"
    restart: always